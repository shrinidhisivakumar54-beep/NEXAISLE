[build]
  command = "npm run build"
  publish = "dist"

# Projects is a static page; the shopping app uses client-side routes.
[[redirects]]
  from = "/projects"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/projects/"
  to = "/projects/index.html"
  status = 200

# Static hosting does not provide the private image-generation server.
[[redirects]]
  from = "/api/*"
  to = "/service-unavailable.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
